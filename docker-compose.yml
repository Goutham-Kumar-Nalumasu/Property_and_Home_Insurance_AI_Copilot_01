version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    container_name: homeshield-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - MEM0_HOST=qdrant
      - MEM0_PORT=6333
      - MCP_SERVER_HOST=0.0.0.0
    command: bash -c "python -m app.mcp_server & uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - qdrant

  streamlit:
    build: .
    container_name: homeshield-ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run app/frontend/streamlit_app.py --server.address 0.0.0.0
    depends_on:
      - api

volumes:
  qdrant_data: