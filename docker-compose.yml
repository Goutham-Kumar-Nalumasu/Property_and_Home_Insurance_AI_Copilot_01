services:
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: homeshield-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  redis:
    image: redis/redis-stack:latest
    container_name: homeshield-redis
    ports:
      - "6379:6379"
      - "8001:8001"

volumes:
  qdrant_storage: