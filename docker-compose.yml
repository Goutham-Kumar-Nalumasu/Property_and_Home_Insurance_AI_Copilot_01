version: "3.9"

services:
  api:
    build: .
    container_name: homeshield-api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  streamlit:
    build: .
    container_name: homeshield-ui
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    command: streamlit run app/frontend/streamlit_app.py --server.address 0.0.0.0
    depends_on:
      - api